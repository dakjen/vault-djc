<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Meeting Vault · DakJen Creative</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231B2A4A'/><text y='.85em' font-size='72' x='12'>📅</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meeting Vault">
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2A4A;--navy-light:#243659;--navy-xlight:#e8ecf3;
  --rose:#C0737A;--rose-light:#f5e8e9;--rose-dark:#a85e64;
  --gray:#2D2D2D;--gray2:#6b6b6b;--gray3:#a0a0a0;--gray4:#e8e6e2;--gray5:#f5f4f1;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--gray5);color:var(--gray);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
::placeholder{color:var(--gray3)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--gray4);border-radius:3px}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.sidebar-header{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-weight:700;font-size:14px;color:#fff}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.07em;text-transform:uppercase;margin-top:1px}
.btn-new{width:100%;background:var(--rose);color:white;border:none;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background 0.15s}
.btn-new:hover{background:var(--rose-dark)}
.meeting-list{flex:1;overflow-y:auto;padding:8px}
.meeting-item{width:100%;text-align:left;background:transparent;border:0.5px solid transparent;border-radius:8px;padding:10px 12px;margin-bottom:2px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:all 0.1s}
.meeting-item:hover{background:rgba(255,255,255,0.08)}
.meeting-item.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.2)}
.meeting-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.meeting-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-meta{font-size:11px;color:rgba(255,255,255,0.38);margin-top:2px}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;color:rgba(255,255,255,0.22);text-align:center;letter-spacing:0.04em}
.main{flex:1;overflow-y:auto;background:#fff}
.meeting-header{padding:22px 32px 16px;border-bottom:1px solid var(--gray4);background:#fff;position:sticky;top:0;z-index:5}
.meeting-title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.meeting-title{font-size:20px;font-weight:700;color:var(--navy)}
.badge{font-size:10px;font-weight:700;letter-spacing:0.06em;padding:3px 9px;border-radius:20px;text-transform:uppercase;background:var(--navy-xlight);color:var(--navy)}
.header-btns{margin-left:auto;display:flex;gap:8px}
.btn{border:0.5px solid #c8c3ba;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--gray);transition:all 0.12s}
.btn:hover{background:var(--gray5)}
.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-light)}
.btn.rose{background:var(--rose);color:white;border-color:var(--rose)}
.btn.rose:hover{background:var(--rose-dark)}
.btn.danger{color:var(--rose-dark);border-color:var(--rose)}
.btn.danger:hover{background:var(--rose-light)}
.btn.sm{padding:5px 12px;font-size:11px}
.meeting-body{padding:28px 32px;max-width:740px}
.section-title{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray3)}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-note{font-size:12px;color:var(--gray3);margin-bottom:14px}
.divider{border:none;border-top:1px solid var(--gray4);margin:28px 0}
.doc-row{display:flex;align-items:center;gap:10px;background:var(--gray5);border:0.5px solid var(--gray4);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.doc-name{flex:1;font-size:13px;color:var(--navy);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-name:hover{color:var(--rose-dark);text-decoration:underline}
.doc-badge{font-size:10px;color:var(--gray3);text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0}
.del-btn{background:none;border:none;color:var(--gray3);font-size:17px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;margin-left:4px}
.del-btn:hover{color:var(--rose-dark)}
.doc-actions{display:flex;gap:8px;margin-top:4px}
.notes-split{display:flex;gap:0;min-height:320px;border:0.5px solid var(--gray4);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.notes-list{width:100%;border-right:none;overflow-y:auto;max-height:500px;transition:width 0.2s}
.notes-split.has-editor .notes-list{width:260px;min-width:200px;border-right:0.5px solid var(--gray4)}
.note-item{width:100%;text-align:left;background:transparent;border:none;border-bottom:0.5px solid var(--gray4);padding:12px 16px;cursor:pointer;display:block;transition:background 0.1s}
.note-item:last-child{border-bottom:none}
.note-item:hover{background:var(--gray5)}
.note-item.active{background:var(--rose-light)}
.note-item-date{font-size:12px;font-weight:700;color:var(--navy)}
.note-item-preview{font-size:12px;color:var(--gray3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-editor{flex:1;display:flex;flex-direction:column;min-width:0}
.note-editor-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--gray5);border-bottom:0.5px solid var(--gray4)}
.note-date-input{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--navy);outline:none;font-family:inherit;cursor:pointer}
.note-date-input:focus{border-bottom:1.5px solid var(--rose)}
.note-friendly{font-size:12px;color:var(--gray3);margin-left:2px}
.note-editor-body{flex:1;padding:14px 16px;display:flex;flex-direction:column}
.note-textarea{width:100%;flex:1;min-height:200px;border:none;outline:none;font-size:14px;line-height:1.8;color:var(--gray);background:transparent;resize:vertical;font-family:Georgia,serif}
.note-editor-footer{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:0.5px solid var(--gray4);background:var(--gray5)}
.note-saved-msg{font-size:11px;color:var(--gray3);margin-left:auto}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px;padding:48px;text-align:center}
.empty-state p{font-size:14px;max-width:280px;line-height:1.6;color:var(--gray2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:12px;width:420px;max-width:100%;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,0.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:0.5px solid var(--gray4)}
.modal-title{font-size:15px;font-weight:700;color:var(--navy)}
.modal-close{background:none;border:none;color:var(--gray3);font-size:22px;cursor:pointer;line-height:1}
.fl{font-size:11px;font-weight:600;color:var(--gray2);display:block;margin-bottom:5px;letter-spacing:0.03em}
.fi{width:100%;border:0.5px solid #ccc;border-radius:7px;padding:9px 12px;font-size:13px;color:var(--gray);background:#fff;outline:none;margin-bottom:14px;transition:border-color 0.15s}
.fi:focus{border-color:var(--rose)}
.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;flex-shrink:0}
/* sidebar nav */
.nav-section{padding:8px 8px 2px}
.nav-item{width:100%;text-align:left;background:transparent;border:0.5px solid transparent;border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;font-weight:600;transition:all 0.1s}
.nav-item:hover{background:rgba(255,255,255,0.08)}
.nav-item.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.2)}
.nav-item .ic{font-size:15px;line-height:1}
.nav-item .nav-count{margin-left:auto;font-size:10px;font-weight:700;background:var(--rose);color:#fff;border-radius:10px;padding:1px 7px;min-width:18px;text-align:center}
.list-label{font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.3);padding:12px 14px 4px}
/* home / reminders boxes */
.home-body{padding:28px 32px;max-width:1000px}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:6px}
@media(max-width:760px){.cat-grid{grid-template-columns:1fr}}
.cat-box{border:0.5px solid var(--gray4);border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.04);display:flex;flex-direction:column;overflow:hidden}
.cat-box-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:0.5px solid var(--gray4);background:var(--gray5)}
.cat-box-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.cat-box-name{font-size:13px;font-weight:700;color:var(--navy)}
.cat-box-count{font-size:11px;color:var(--gray3);font-weight:600}
.cat-box-body{padding:8px 10px;flex:1;display:flex;flex-direction:column;gap:2px;min-height:30px}
.cat-empty{font-size:12px;color:var(--gray3);padding:8px 6px}
.cat-box-add{display:flex;gap:6px;padding:8px 12px 13px;flex-wrap:wrap;border-top:0.5px solid var(--gray4)}
.cat-add-input{flex:1;min-width:120px;border:0.5px solid var(--gray4);border-radius:7px;padding:7px 10px;font-size:13px;color:var(--gray);outline:none;transition:border-color .15s}
.cat-add-input:focus{border-color:var(--rose)}
.rem-date{border:0.5px solid var(--gray4);border-radius:7px;padding:6px 8px;font-size:12px;color:var(--gray);outline:none;background:#fff;transition:border-color .15s}
.rem-date:focus{border-color:var(--rose)}
.rem-row{display:flex;align-items:flex-start;gap:10px;padding:8px 8px;border-radius:8px;transition:background .12s}
.rem-row:hover{background:var(--gray5)}
.rem-check{width:19px;height:19px;border-radius:6px;border:1.8px solid var(--gray3);background:#fff;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;padding:0}
.rem-check:hover{border-color:var(--rose)}
.rem-check.checked{background:var(--rose);border-color:var(--rose)}
.rem-check.checked::after{content:'✓';color:#fff;font-size:12px;font-weight:700;line-height:1}
.rem-main{flex:1;min-width:0}
.rem-text{font-size:13.5px;color:var(--gray);line-height:1.45;word-break:break-word}
.rem-row.done .rem-text{text-decoration:line-through;color:var(--gray3)}
.rem-due{display:inline-block;font-size:10.5px;font-weight:600;color:var(--gray2);background:var(--gray5);border-radius:5px;padding:2px 7px;margin-top:5px}
.rem-row:hover .rem-due{background:#eceae6}
.rem-due.overdue{background:var(--rose-light);color:var(--rose-dark)}
.rem-due.today{background:var(--navy-xlight);color:var(--navy)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy)}
.login-box{background:#fff;border-radius:14px;padding:36px 32px;width:340px;max-width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25)}
.login-box h1{font-size:18px;color:var(--navy);margin-bottom:4px}
.login-box p{font-size:12px;color:var(--gray3);margin-bottom:22px}
.login-box .fi{text-align:center;font-size:15px;letter-spacing:0.1em}
.login-err{color:var(--rose-dark);font-size:12px;margin-bottom:10px;min-height:16px}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap" style="display:none">
  <div class="login-box">
    <div style="margin-bottom:18px">
      <div class="logo-icon" style="margin:0 auto 10px;width:44px;height:44px;border-radius:12px">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="11" rx="2.5" stroke="white" strokeWidth="1.4"/><path d="M4 7h8M4 9.5h6" stroke="white" strokeWidth="1.3" strokeLinecap="round"/></svg>
      </div>
    </div>
    <h1>Meeting Vault</h1>
    <p>DakJen Creative</p>
    <div class="login-err" id="loginErr"></div>
    <input class="fi" id="loginPw" type="password" placeholder="Enter password" autocomplete="current-password">
    <button class="btn primary" style="width:100%;margin-top:4px" onclick="doLogin()">Unlock</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="11" rx="2.5" stroke="white" strokeWidth="1.4"/><path d="M4 7h8M4 9.5h6" stroke="white" strokeWidth="1.3" strokeLinecap="round"/></svg>
        </div>
        <div>
          <div class="logo-text">Meeting Vault</div>
          <div class="logo-sub">DakJen Creative</div>
        </div>
      </div>
      <button class="btn-new" onclick="showModal('newMeeting')">+ New Meeting</button>
    </div>
    <div class="nav-section">
      <button class="nav-item" id="homeNav" onclick="goHome()">
        <span class="ic">🏠</span><span>Home</span><span class="nav-count" id="homeCount" style="display:none"></span>
      </button>
    </div>
    <div class="list-label">Meetings</div>
    <div class="meeting-list" id="meetingList"></div>
    <div class="sidebar-foot">dakjencreative.com</div>
  </div>
  <div class="main" id="mainPane"></div>
</div>

<script>
const COLORS=['#C0737A','#1B2A4A','#4a7c6b','#8b6b1a','#6b3d8b','#2d5888'];
let meetings=[];
let categories=[];
let reminders=[];
let view='home';
let activeId=null;
let activeNoteId=null;
let selColor=COLORS[0];
let token=sessionStorage.getItem('vault_token')||'';

function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeUrl(u){try{const p=new URL(u,location.href);return/^https?:$/.test(p.protocol)?p.href:'';}catch(e){return'';}}
function fmtFriendly(iso){if(!iso)return'';try{const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}catch(e){return'';}}
function getMeeting(){return meetings.find(m=>m.id===activeId);}

async function api(path,opts={}){
  const headers={'Authorization':'Bearer '+token,...(opts.headers||{})};
  if(opts.body&&typeof opts.body==='object'&&!(opts.body instanceof ReadableStream)&&!(opts.body instanceof Blob)){
    headers['Content-Type']='application/json';
    opts.body=JSON.stringify(opts.body);
  }
  const r=await fetch('/api/'+path,{...opts,headers});
  if(r.status===401){sessionStorage.removeItem('vault_token');token='';showLogin();throw new Error('Unauthorized');}
  return r.json();
}

function showLogin(){
  document.getElementById('loginScreen').style.display='';
  document.getElementById('app').style.display='none';
  document.getElementById('loginPw').value='';
  document.getElementById('loginErr').textContent='';
  setTimeout(()=>document.getElementById('loginPw').focus(),60);
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='';
}

async function doLogin(){
  const pw=document.getElementById('loginPw').value;
  if(!pw)return;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const data=await r.json();
    if(!r.ok){document.getElementById('loginErr').textContent=data.error||'Invalid password';return;}
    token=data.token;
    sessionStorage.setItem('vault_token',token);
    // Boot the app cleanly from the stored token — same path as a manual refresh,
    // so a transient first-call hiccup can't bounce you back to the login screen.
    location.reload();
  }catch(e){document.getElementById('loginErr').textContent='Connection error';}
}

document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function initApp(){
  try{
    await api('setup',{method:'POST'});
    meetings=await api('meetings');
    try{
      categories=await api('categories');
      reminders=await api('reminders');
    }catch(e){console.error('reminders load failed',e);}
    render();
  }catch(e){console.error(e);}
}

function render(){renderSidebar();renderMain();}

function renderSidebar(){
  const homeNav=document.getElementById('homeNav');
  if(homeNav)homeNav.classList.toggle('active',view==='home');
  const hc=document.getElementById('homeCount');
  if(hc){const open=reminders.filter(r=>!r.done).length;
    if(open>0){hc.textContent=open;hc.style.display='';}else{hc.style.display='none';}}
  const el=document.getElementById('meetingList');
  if(!meetings.length){
    el.innerHTML='<div style="padding:22px 12px;text-align:center;font-size:12px;color:rgba(255,255,255,0.28)">No meetings yet.</div>';
    return;
  }
  el.innerHTML=meetings.map(m=>{
    const nc=(m.notes||[]).length, dc=(m.docs||[]).length;
    return`<button class="meeting-item${(view==='meeting'&&m.id===activeId)?' active':''}" onclick="selectMeeting('${esc(m.id)}')">
      <div class="meeting-dot" style="background:${m.color||'#C0737A'}"></div>
      <div style="flex:1;min-width:0">
        <div class="meeting-name">${esc(m.name)}</div>
        <div class="meeting-meta">${nc} note${nc!==1?'s':''} · ${dc} doc${dc!==1?'s':''}</div>
      </div>
    </button>`;
  }).join('');
}

function renderMain(){
  if(view==='home'){renderHome();return;}
  const mp=document.getElementById('mainPane');
  const m=getMeeting();
  if(!m){
    mp.innerHTML=`<div class="empty-state">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><rect x="7" y="10" width="42" height="36" rx="6" stroke="#C0737A" strokeWidth="1.6"/><path d="M16 22h24M16 29h24M16 36h14" stroke="#e0dbd4" strokeWidth="1.6" strokeLinecap="round"/><rect x="20" y="5" width="16" height="9" rx="3" stroke="#1B2A4A" strokeWidth="1.4"/></svg>
      <p>Select a meeting or create one to get started.</p>
      <button class="btn primary" onclick="showModal('newMeeting')">Create first meeting</button>
    </div>`;
    return;
  }

  const docs=m.docs||[], notes=m.notes||[];

  mp.innerHTML=`
    <div class="meeting-header">
      <div class="meeting-title-row">
        <div style="width:11px;height:11px;border-radius:50%;background:${m.color||'#C0737A'};flex-shrink:0"></div>
        <span class="meeting-title">${esc(m.name)}</span>
        ${m.cadence?`<span class="badge">${esc(m.cadence)}</span>`:''}
        <div class="header-btns">
          <button class="btn danger sm" onclick="deleteMeeting('${esc(m.id)}')">Delete</button>
        </div>
      </div>
      ${m.attendees&&m.attendees.length?`<div style="font-size:12px;color:var(--gray3);margin-top:5px;margin-left:21px">${m.attendees.map(a=>esc(a)).join(' · ')}</div>`:''}
    </div>

    <div class="meeting-body">

      <div class="section-row">
        <span class="section-title">Standing documents</span>
      </div>
      <div class="section-note">Links and files needed at every meeting.</div>

      <div id="docsArea">
        ${!docs.length?'<div style="font-size:13px;color:var(--gray3);margin-bottom:12px">No documents added yet.</div>':''}
        ${docs.map(d=>renderDoc(d)).join('')}
      </div>
      <div class="doc-actions">
        <button class="btn sm" onclick="showModal('addLink')">+ Add link</button>
        <label class="btn sm" style="cursor:pointer">+ Upload file<input type="file" multiple style="display:none" onchange="handleUpload(event)"></label>
      </div>

      <hr class="divider">

      <div class="section-row" style="margin-bottom:14px">
        <span class="section-title">Meeting notes</span>
        <button class="btn rose sm" onclick="addNote()">+ New note</button>
      </div>

      <div id="notesArea">
        ${!notes.length?'<div style="font-size:13px;color:var(--gray3)">No notes yet. Hit "+ New note" to log today\'s meeting.</div>'
        :`<div class="notes-split${activeNoteId&&notes.find(n=>n.id===activeNoteId)?' has-editor':''}" id="notesSplit">
          <div class="notes-list">
            ${notes.map(n=>renderNoteItem(n)).join('')}
          </div>
          ${activeNoteId&&notes.find(n=>n.id===activeNoteId)?renderNoteEditor(notes.find(n=>n.id===activeNoteId)):''}
        </div>`}
      </div>

    </div>`;
}

function goHome(){view='home';render();}

function dueInfo(iso){
  if(!iso)return null;
  const t=todayISO();
  if(iso<t)return{cls:'overdue',label:'Overdue · '+fmtFriendly(iso)};
  if(iso===t)return{cls:'today',label:'Today'};
  const tm=new Date(t+'T12:00:00');tm.setDate(tm.getDate()+1);
  if(iso===tm.toISOString().slice(0,10))return{cls:'',label:'Tomorrow'};
  return{cls:'',label:fmtFriendly(iso)};
}

function sortReminders(arr){
  return arr.slice().sort((a,b)=>{
    if(!!a.done!==!!b.done)return a.done?1:-1;
    const ad=a.deadline||'9999-99-99',bd=b.deadline||'9999-99-99';
    return ad<bd?-1:ad>bd?1:0;
  });
}

function renderReminder(r){
  const di=dueInfo(r.deadline);
  return`<div class="rem-row${r.done?' done':''}">
    <button class="rem-check${r.done?' checked':''}" onclick="toggleReminder('${esc(r.id)}')" title="Toggle done"></button>
    <div class="rem-main">
      <div class="rem-text">${esc(r.text)}</div>
      ${di?`<span class="rem-due ${di.cls}">${di.label}</span>`:''}
    </div>
    <button class="del-btn" onclick="deleteReminder('${esc(r.id)}')">×</button>
  </div>`;
}

function renderCatBox(g){
  const open=g.items.filter(r=>!r.done).length;
  const doneN=g.items.length-open;
  const rows=g.items.length?sortReminders(g.items).map(renderReminder).join('')
    :`<div class="cat-empty">No tasks yet.</div>`;
  return`<div class="cat-box">
    <div class="cat-box-head">
      <span class="cat-box-dot" style="background:${g.color}"></span>
      <span class="cat-box-name">${esc(g.name)}</span>
      <span class="cat-box-count">${open} open${doneN?` · ${doneN} done`:''}</span>
      ${g.cat?`<button class="del-btn" style="margin-left:auto" onclick="deleteCategory('${esc(g.key)}')" title="Delete category">×</button>`:''}
    </div>
    <div class="cat-box-body">${rows}</div>
    <div class="cat-box-add">
      <input class="cat-add-input" id="add_text_${esc(g.key)}" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addReminder('${esc(g.key)}')">
      <input class="rem-date" type="date" id="add_date_${esc(g.key)}" title="Deadline (optional)">
      <button class="btn rose sm" onclick="addReminder('${esc(g.key)}')">Add</button>
    </div>
  </div>`;
}

function renderHome(){
  const mp=document.getElementById('mainPane');
  const open=reminders.filter(r=>!r.done).length;
  const done=reminders.length-open;
  const groups=categories.map(c=>({
    key:c.id,name:c.name,color:c.color||'#a0a0a0',cat:true,
    items:reminders.filter(r=>r.category_id===c.id)
  }));
  groups.push({key:'uncat',name:'Uncategorized',color:'#a0a0a0',cat:false,
    items:reminders.filter(r=>!r.category_id)});

  mp.innerHTML=`
    <div class="meeting-header">
      <div class="meeting-title-row">
        <span class="meeting-title">🏠 Home</span>
        <div class="header-btns">
          <button class="btn sm" onclick="showModal('newCategory')">+ New category</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--gray3);margin-top:5px">${open} open · ${done} completed · saved to your vault.</div>
    </div>
    <div class="home-body">
      <div class="section-row" style="margin-bottom:4px"><span class="section-title">Reminders</span></div>
      <div class="section-note">A running checklist with deadlines, organized into category boxes. Check items off as you go.</div>
      <div class="cat-grid">${groups.map(renderCatBox).join('')}</div>
    </div>`;
}

async function addReminder(catKey){
  const t=document.getElementById('add_text_'+catKey);
  const text=t&&t.value.trim();if(!text)return;
  const d=document.getElementById('add_date_'+catKey);
  const deadline=(d&&d.value)||null;
  const category_id=catKey==='uncat'?null:catKey;
  const r={id:gid(),category_id,text,deadline,done:false,created_at:new Date().toISOString()};
  reminders.unshift(r);
  render();
  setTimeout(()=>{const el=document.getElementById('add_text_'+catKey);if(el)el.focus();},40);
  try{await api('reminders',{method:'POST',body:{id:r.id,category_id,text,deadline}});}catch(e){console.error(e);}
}

async function toggleReminder(id){
  const r=reminders.find(x=>x.id===id);if(!r)return;
  r.done=!r.done;
  render();
  try{await api('reminders',{method:'PUT',body:{id,done:r.done}});}catch(e){console.error(e);}
}

async function deleteReminder(id){
  reminders=reminders.filter(r=>r.id!==id);
  render();
  try{await api('reminders?id='+encodeURIComponent(id),{method:'DELETE'});}catch(e){console.error(e);}
}

async function createCategory(){
  const name=document.getElementById('c_name')?.value?.trim();if(!name)return;
  const c={id:gid(),name,color:selColor,created_at:new Date().toISOString()};
  categories.push(c);
  closeModal();render();
  try{await api('categories',{method:'POST',body:{id:c.id,name:c.name,color:c.color}});}catch(e){console.error(e);}
}

async function deleteCategory(id){
  if(!confirm('Delete this category? Its tasks will move to Uncategorized.'))return;
  categories=categories.filter(c=>c.id!==id);
  reminders.forEach(r=>{if(r.category_id===id)r.category_id=null;});
  render();
  try{await api('categories?id='+encodeURIComponent(id),{method:'DELETE'});}catch(e){console.error(e);}
}

function renderDoc(d){
  const isFile=d.type==='file';
  const href=isFile?esc(safeUrl(d.url)||'#'):esc(safeUrl(d.url)||'#');
  return`<div class="doc-row" id="doc_${esc(d.id)}">
    ${isFile
      ?`<svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="flex-shrink:0"><path d="M8.5 1H4a1 1 0 00-1 1v11a1 1 0 001 1h7a1 1 0 001-1V5.5L8.5 1z" stroke="#1B2A4A" strokeWidth="1.2" strokeLinejoin="round"/><path d="M8.5 1v4.5H13" stroke="#1B2A4A" strokeWidth="1.2" strokeLinecap="round"/></svg>`
      :`<svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="flex-shrink:0"><path d="M6.5 4H4a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V8.5" stroke="#aaa" strokeWidth="1.2" strokeLinecap="round"/><path d="M9.5 2h3v3M12.5 2L8 6.5" stroke="#1B2A4A" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>`
    }
    <a href="${href}" target="_blank" rel="noopener noreferrer" class="doc-name">${esc(d.label||d.url)}</a>
    <span class="doc-badge">${isFile?'file':'link'}</span>
    <button class="del-btn" onclick="deleteDoc('${esc(d.id)}')">×</button>
  </div>`;
}

function renderNoteItem(n){
  const preview=(n.text||'').slice(0,80)||'Empty note';
  return`<button class="note-item${n.id===activeNoteId?' active':''}" onclick="selectNote('${esc(n.id)}')">
    <div class="note-item-date">${n.date?fmtFriendly(n.date):'No date'}</div>
    <div class="note-item-preview">${esc(preview)}</div>
  </button>`;
}

function renderNoteEditor(n){
  return`<div class="note-editor">
    <div class="note-editor-header">
      <input class="note-date-input" type="date" value="${esc(n.date||'')}" onchange="updateNoteDate('${esc(n.id)}',this.value)" title="Change date">
      <span class="note-friendly">${n.date?fmtFriendly(n.date):''}</span>
      <button class="del-btn" style="margin-left:auto" onclick="deleteNote('${esc(n.id)}')" title="Delete note">×</button>
      <button class="del-btn" onclick="closeNote()" title="Close" style="font-size:20px;margin-left:4px">✕</button>
    </div>
    <div class="note-editor-body">
      <textarea class="note-textarea" id="noteEditorText" placeholder="Write your notes here…" oninput="updateNoteText('${esc(n.id)}',this.value)">${esc(n.text||'')}</textarea>
    </div>
    <div class="note-editor-footer">
      <button class="btn rose sm" onclick="saveNote('${esc(n.id)}')">Save</button>
      <button class="btn sm" onclick="closeNote()">Close</button>
      <span class="note-saved-msg" id="noteSavedMsg"></span>
    </div>
  </div>`;
}

function selectNote(id){activeNoteId=id;render();}
function closeNote(){activeNoteId=null;render();}

function selectMeeting(id){view='meeting';activeId=id;activeNoteId=null;render();}

async function deleteMeeting(id){
  if(!confirm('Delete this meeting and all its data?'))return;
  await api('meetings?id='+encodeURIComponent(id),{method:'DELETE'});
  meetings=meetings.filter(m=>m.id!==id);
  if(activeId===id)activeId=null;
  render();
}

async function addNote(){
  const m=getMeeting();if(!m)return;
  const today=new Date().toISOString().slice(0,10);
  const n={id:gid(),date:today,text:'',created_at:new Date().toISOString()};
  await api('notes',{method:'POST',body:{id:n.id,meeting_id:m.id,date:n.date,text:''}});
  m.notes=m.notes||[];
  m.notes.unshift(n);
  activeNoteId=n.id;
  render();
  setTimeout(()=>{const ta=document.getElementById('noteEditorText');if(ta)ta.focus();},60);
}

let _saveTimers={};
function updateNoteText(nid,val){
  const m=getMeeting();if(!m)return;
  const n=(m.notes||[]).find(x=>x.id===nid);
  if(n){
    n.text=val;
    clearTimeout(_saveTimers[nid]);
    _saveTimers[nid]=setTimeout(()=>{
      api('notes',{method:'PUT',body:{id:nid,text:val}});
    },500);
  }
}

async function saveNote(nid){
  const m=getMeeting();if(!m)return;
  const n=(m.notes||[]).find(x=>x.id===nid);
  if(n){
    clearTimeout(_saveTimers[nid]);
    await api('notes',{method:'PUT',body:{id:nid,text:n.text,date:n.date}});
    const msg=document.getElementById('noteSavedMsg');
    if(msg){msg.textContent='Saved!';setTimeout(()=>{if(msg)msg.textContent='';},2000);}
    // Update the list item preview
    render();
    setTimeout(()=>{const ta=document.getElementById('noteEditorText');if(ta)ta.focus();},30);
  }
}

async function updateNoteDate(nid,val){
  const m=getMeeting();if(!m)return;
  const n=(m.notes||[]).find(x=>x.id===nid);
  if(n){
    n.date=val;
    await api('notes',{method:'PUT',body:{id:nid,date:val}});
    const card=document.getElementById('note_'+nid);
    if(card)card.outerHTML=renderNote(n);
  }
}

async function deleteNote(nid){
  if(!confirm('Delete this note?'))return;
  const m=getMeeting();if(!m)return;
  await api('notes?id='+encodeURIComponent(nid),{method:'DELETE'});
  m.notes=(m.notes||[]).filter(n=>n.id!==nid);
  if(activeNoteId===nid)activeNoteId=null;
  render();
}

async function deleteDoc(did){
  const m=getMeeting();if(!m)return;
  await api('docs?id='+encodeURIComponent(did),{method:'DELETE'});
  m.docs=(m.docs||[]).filter(d=>d.id!==did);
  render();
}

async function handleUpload(e){
  const m=getMeeting();if(!m)return;
  const files=Array.from(e.target.files);
  for(const file of files){
    const res=await fetch('/api/upload?filename='+encodeURIComponent(file.name),{
      method:'POST',
      headers:{'Authorization':'Bearer '+token},
      body:file,
    });
    if(!res.ok){alert('Upload failed: '+file.name);continue;}
    const blob=await res.json();
    const doc={id:gid(),type:'file',label:file.name,url:blob.url,size:blob.size||file.size};
    await api('docs',{method:'POST',body:{...doc,meeting_id:m.id}});
    m.docs=m.docs||[];
    m.docs.push({...doc,added_at:new Date().toISOString()});
  }
  e.target.value='';
  render();
}

function showModal(type){
  closeModal();selColor=COLORS[0];
  let html='';
  if(type==='newMeeting'){
    html=`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><span class="modal-title">New meeting</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <label class="fl">Meeting name *</label>
      <input class="fi" id="m_name" placeholder="e.g. Board Meeting, Weekly Standup, Client Call">
      <label class="fl">Cadence</label>
      <select class="fi" id="m_cadence">
        <option value="">None</option>
        <option>Daily</option><option>Weekly</option><option>Bi-weekly</option><option>Monthly</option><option>Quarterly</option><option>Ad-hoc</option>
      </select>
      <label class="fl">Attendees (comma separated)</label>
      <input class="fi" id="m_att" placeholder="e.g. Jen, Marcus, Sarah">
      <label class="fl">Color</label>
      <div style="display:flex;gap:9px;margin-bottom:18px">${COLORS.map((c,i)=>`<div class="swatch" id="sw_${i}" style="background:${c};border-color:${i===0?'#333':'transparent'}" onclick="pickColor('${c}',${i})"></div>`).join('')}</div>
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createMeeting()">Create</button></div>
    </div>`;
  } else if(type==='newCategory'){
    html=`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><span class="modal-title">New category</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <label class="fl">Category name *</label>
      <input class="fi" id="c_name" placeholder="e.g. Work, Personal, Errands, Follow-ups" onkeydown="if(event.key==='Enter')createCategory()">
      <label class="fl">Color</label>
      <div style="display:flex;gap:9px;margin-bottom:18px">${COLORS.map((c,i)=>`<div class="swatch" id="sw_${i}" style="background:${c};border-color:${i===0?'#333':'transparent'}" onclick="pickColor('${c}',${i})"></div>`).join('')}</div>
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createCategory()">Create</button></div>
    </div>`;
  } else if(type==='addLink'){
    html=`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><span class="modal-title">Add document link</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <label class="fl">URL *</label>
      <input class="fi" id="m_url" placeholder="https://…">
      <label class="fl">Label</label>
      <input class="fi" id="m_label" placeholder="e.g. Agenda Template, Q3 Deck, Brand Guide…">
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doAddLink()">Add link</button></div>
    </div>`;
  }
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='modalOverlay';ov.innerHTML=html;
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  document.body.appendChild(ov);
  setTimeout(()=>{const fi=ov.querySelector('input:not([type="file"])');if(fi)fi.focus();},60);
}

function closeModal(){const el=document.getElementById('modalOverlay');if(el)el.remove();}
function pickColor(c,idx){selColor=c;COLORS.forEach((_,i)=>{const d=document.getElementById('sw_'+i);if(d)d.style.borderColor=i===idx?'#333':'transparent';});}

async function createMeeting(){
  const name=document.getElementById('m_name')?.value?.trim();if(!name)return;
  const cadence=document.getElementById('m_cadence')?.value||'';
  const att=(document.getElementById('m_att')?.value||'').split(',').map(a=>a.trim()).filter(Boolean);
  const m={id:gid(),name,cadence,attendees:att,color:selColor,docs:[],notes:[],created_at:new Date().toISOString()};
  await api('meetings',{method:'POST',body:{id:m.id,name:m.name,cadence:m.cadence,attendees:m.attendees,color:m.color}});
  meetings.push(m);activeId=m.id;
  closeModal();render();
}

async function doAddLink(){
  const raw=document.getElementById('m_url')?.value?.trim();if(!raw)return;
  const url=safeUrl(raw);if(!url){alert('Please enter a valid http or https URL.');return;}
  const label=document.getElementById('m_label')?.value?.trim()||raw;
  const m=getMeeting();if(!m)return;
  const doc={id:gid(),type:'link',url,label};
  await api('docs',{method:'POST',body:{...doc,meeting_id:m.id}});
  m.docs=m.docs||[];
  m.docs.push({...doc,added_at:new Date().toISOString()});
  closeModal();render();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// Boot
if(token){
  showApp();
  initApp();
} else {
  showLogin();
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
