<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Meeting Vault · DakJen Creative</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231B2A4A'/><text y='.85em' font-size='72' x='12'>📅</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meeting Vault">
<link rel="manifest" href="/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2A4A;--navy-light:#243659;--navy-xlight:#e8ecf3;
  --rose:#C0737A;--rose-light:#f5e8e9;--rose-dark:#a85e64;
  --gray:#2D2D2D;--gray2:#6b6b6b;--gray3:#a0a0a0;--gray4:#e8e6e2;--gray5:#f5f4f1;
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--gray5);color:var(--gray);min-height:100vh}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
::placeholder{color:var(--gray3)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--gray4);border-radius:3px}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.sidebar-header{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:var(--rose);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-weight:700;font-size:14px;color:#fff}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.07em;text-transform:uppercase;margin-top:1px}
.btn-new{width:100%;background:var(--rose);color:white;border:none;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background 0.15s}
.btn-new:hover{background:var(--rose-dark)}
.meeting-list{flex:1;overflow-y:auto;padding:8px}
.meeting-item{width:100%;text-align:left;background:transparent;border:0.5px solid transparent;border-radius:8px;padding:10px 12px;margin-bottom:2px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:all 0.1s}
.meeting-item:hover{background:rgba(255,255,255,0.08)}
.meeting-item.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.2)}
.meeting-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
.meeting-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meeting-meta{font-size:11px;color:rgba(255,255,255,0.38);margin-top:2px}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);font-size:10px;color:rgba(255,255,255,0.22);text-align:center;letter-spacing:0.04em}
.main{flex:1;overflow-y:auto;background:#fff}
.meeting-header{padding:22px 32px 16px;border-bottom:1px solid var(--gray4);background:#fff;position:sticky;top:0;z-index:5}
.meeting-title-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.meeting-title{font-size:20px;font-weight:700;color:var(--navy)}
.badge{font-size:10px;font-weight:700;letter-spacing:0.06em;padding:3px 9px;border-radius:20px;text-transform:uppercase;background:var(--navy-xlight);color:var(--navy)}
.header-btns{margin-left:auto;display:flex;gap:8px}
.btn{border:0.5px solid #c8c3ba;border-radius:7px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--gray);transition:all 0.12s}
.btn:hover{background:var(--gray5)}
.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-light)}
.btn.rose{background:var(--rose);color:white;border-color:var(--rose)}
.btn.rose:hover{background:var(--rose-dark)}
.btn.danger{color:var(--rose-dark);border-color:var(--rose)}
.btn.danger:hover{background:var(--rose-light)}
.btn.sm{padding:5px 12px;font-size:11px}
.meeting-body{padding:28px 32px;max-width:740px}
.section-title{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray3)}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-note{font-size:12px;color:var(--gray3);margin-bottom:14px}
.divider{border:none;border-top:1px solid var(--gray4);margin:28px 0}
.doc-row{display:flex;align-items:center;gap:10px;background:var(--gray5);border:0.5px solid var(--gray4);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.doc-name{flex:1;font-size:13px;color:var(--navy);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-name:hover{color:var(--rose-dark);text-decoration:underline}
.doc-badge{font-size:10px;color:var(--gray3);text-transform:uppercase;letter-spacing:0.04em;flex-shrink:0}
.del-btn{background:none;border:none;color:var(--gray3);font-size:17px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;margin-left:4px}
.del-btn:hover{color:var(--rose-dark)}
.doc-actions{display:flex;gap:8px;margin-top:4px}
.note-card{border:0.5px solid var(--gray4);border-radius:10px;margin-bottom:14px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.note-header{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--gray5);border-bottom:0.5px solid var(--gray4)}
.note-date-input{border:none;background:transparent;font-size:13px;font-weight:700;color:var(--navy);outline:none;font-family:inherit;cursor:pointer}
.note-date-input:focus{border-bottom:1.5px solid var(--rose)}
.note-friendly{font-size:12px;color:var(--gray3);margin-left:2px}
.note-body{padding:14px 16px}
.note-textarea{width:100%;min-height:110px;border:none;outline:none;font-size:14px;line-height:1.8;color:var(--gray);background:transparent;resize:vertical;font-family:Georgia,serif}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:14px;padding:48px;text-align:center}
.empty-state p{font-size:14px;max-width:280px;line-height:1.6;color:var(--gray2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:12px;width:420px;max-width:100%;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,0.18)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:0.5px solid var(--gray4)}
.modal-title{font-size:15px;font-weight:700;color:var(--navy)}
.modal-close{background:none;border:none;color:var(--gray3);font-size:22px;cursor:pointer;line-height:1}
.fl{font-size:11px;font-weight:600;color:var(--gray2);display:block;margin-bottom:5px;letter-spacing:0.03em}
.fi{width:100%;border:0.5px solid #ccc;border-radius:7px;padding:9px 12px;font-size:13px;color:var(--gray);background:#fff;outline:none;margin-bottom:14px;transition:border-color 0.15s}
.fi:focus{border-color:var(--rose)}
.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;flex-shrink:0}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="2.5" width="14" height="11" rx="2.5" stroke="white" strokeWidth="1.4"/><path d="M4 7h8M4 9.5h6" stroke="white" strokeWidth="1.3" strokeLinecap="round"/></svg>
        </div>
        <div>
          <div class="logo-text">Meeting Vault</div>
          <div class="logo-sub">DakJen Creative</div>
        </div>
      </div>
      <button class="btn-new" onclick="showModal('newMeeting')">+ New Meeting</button>
    </div>
    <div class="meeting-list" id="meetingList"></div>
    <div class="sidebar-foot">dakjencreative.com · saved locally</div>
  </div>
  <div class="main" id="mainPane"></div>
</div>

<script>
const SK='mvault3_v1';
const COLORS=['#C0737A','#1B2A4A','#4a7c6b','#8b6b1a','#6b3d8b','#2d5888'];
let state={meetings:[],active:null};
let selColor=COLORS[0];

function load(){try{const r=localStorage.getItem(SK);if(r)state=JSON.parse(r);}catch(e){}}
function save(){try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}}
function gid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function safeUrl(u){try{const p=new URL(u,location.href);return/^https?:$/.test(p.protocol)?p.href:'';}catch(e){return'';}}
function fmtFriendly(iso){if(!iso)return'';try{const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});}catch(e){return'';}}
function getMeeting(){return state.meetings.find(m=>m.id===state.active);}

function render(){save();renderSidebar();renderMain();}

function renderSidebar(){
  const el=document.getElementById('meetingList');
  if(!state.meetings.length){
    el.innerHTML='<div style="padding:22px 12px;text-align:center;font-size:12px;color:rgba(255,255,255,0.28)">No meetings yet.</div>';
    return;
  }
  el.innerHTML=state.meetings.map(m=>{
    const nc=(m.notes||[]).length, dc=(m.docs||[]).length;
    return`<button class="meeting-item${m.id===state.active?' active':''}" onclick="selectMeeting('${m.id}')">
      <div class="meeting-dot" style="background:${m.color||'#C0737A'}"></div>
      <div style="flex:1;min-width:0">
        <div class="meeting-name">${esc(m.name)}</div>
        <div class="meeting-meta">${nc} note${nc!==1?'s':''} · ${dc} doc${dc!==1?'s':''}</div>
      </div>
    </button>`;
  }).join('');
}

function renderMain(){
  const mp=document.getElementById('mainPane');
  const m=getMeeting();
  if(!m){
    mp.innerHTML=`<div class="empty-state">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><rect x="7" y="10" width="42" height="36" rx="6" stroke="#C0737A" strokeWidth="1.6"/><path d="M16 22h24M16 29h24M16 36h14" stroke="#e0dbd4" strokeWidth="1.6" strokeLinecap="round"/><rect x="20" y="5" width="16" height="9" rx="3" stroke="#1B2A4A" strokeWidth="1.4"/></svg>
      <p>Select a meeting or create one to get started.</p>
      <button class="btn primary" onclick="showModal('newMeeting')">Create first meeting</button>
    </div>`;
    return;
  }

  const docs=m.docs||[], notes=m.notes||[];

  mp.innerHTML=`
    <div class="meeting-header">
      <div class="meeting-title-row">
        <div style="width:11px;height:11px;border-radius:50%;background:${m.color||'#C0737A'};flex-shrink:0"></div>
        <span class="meeting-title">${esc(m.name)}</span>
        ${m.cadence?`<span class="badge">${esc(m.cadence)}</span>`:''}
        <div class="header-btns">
          <button class="btn danger sm" onclick="deleteMeeting('${m.id}')">Delete</button>
        </div>
      </div>
      ${m.attendees&&m.attendees.length?`<div style="font-size:12px;color:var(--gray3);margin-top:5px;margin-left:21px">${m.attendees.map(a=>esc(a)).join(' · ')}</div>`:''}
    </div>

    <div class="meeting-body">

      <div class="section-row">
        <span class="section-title">Standing documents</span>
      </div>
      <div class="section-note">Links and files needed at every meeting — always at the top.</div>

      <div id="docsArea">
        ${!docs.length?'<div style="font-size:13px;color:var(--gray3);margin-bottom:12px">No documents added yet.</div>':''}
        ${docs.map(d=>renderDoc(d)).join('')}
      </div>
      <div class="doc-actions">
        <button class="btn sm" onclick="showModal('addLink')">+ Add link</button>
        <label class="btn sm" style="cursor:pointer">+ Upload file<input type="file" multiple style="display:none" onchange="handleUpload(event)"></label>
      </div>

      <hr class="divider">

      <div class="section-row" style="margin-bottom:14px">
        <span class="section-title">Meeting notes</span>
        <button class="btn rose sm" onclick="addNote()">+ New note</button>
      </div>

      <div id="notesArea">
        ${!notes.length?'<div style="font-size:13px;color:var(--gray3)">No notes yet. Hit "+ New note" to log today\'s meeting.</div>':''}
        ${notes.map(n=>renderNote(n)).join('')}
      </div>

    </div>`;
}

function renderDoc(d){
  const isFile=d.type==='file';
  return`<div class="doc-row" id="doc_${d.id}">
    ${isFile
      ?`<svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="flex-shrink:0"><path d="M8.5 1H4a1 1 0 00-1 1v11a1 1 0 001 1h7a1 1 0 001-1V5.5L8.5 1z" stroke="#1B2A4A" strokeWidth="1.2" strokeLinejoin="round"/><path d="M8.5 1v4.5H13" stroke="#1B2A4A" strokeWidth="1.2" strokeLinecap="round"/></svg>`
      :`<svg width="15" height="15" viewBox="0 0 15 15" fill="none" style="flex-shrink:0"><path d="M6.5 4H4a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V8.5" stroke="#aaa" strokeWidth="1.2" strokeLinecap="round"/><path d="M9.5 2h3v3M12.5 2L8 6.5" stroke="#1B2A4A" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>`
    }
    ${isFile
      ?`<a href="${esc(d.data)}" download="${esc(d.label)}" class="doc-name">${esc(d.label)}</a>`
      :`<a href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener noreferrer" class="doc-name">${esc(d.label||d.url)}</a>`
    }
    <span class="doc-badge">${isFile?'file':'link'}</span>
    <button class="del-btn" onclick="deleteDoc('${d.id}')">×</button>
  </div>`;
}

function renderNote(n){
  return`<div class="note-card" id="note_${n.id}">
    <div class="note-header">
      <input class="note-date-input" type="date" value="${esc(n.date||'')}" onchange="updateNoteDate('${n.id}',this.value)" title="Change date">
      <span class="note-friendly">${n.date?fmtFriendly(n.date):''}</span>
      <button class="del-btn" style="margin-left:auto" onclick="deleteNote('${n.id}')">×</button>
    </div>
    <div class="note-body">
      <textarea class="note-textarea" placeholder="Write your notes here…" onchange="updateNoteText('${n.id}',this.value)">${esc(n.text||'')}</textarea>
    </div>
  </div>`;
}

function selectMeeting(id){state.active=id;render();}

function deleteMeeting(id){
  if(!confirm('Delete this meeting and all its data?'))return;
  state.meetings=state.meetings.filter(m=>m.id!==id);
  if(state.active===id)state.active=null;
  render();
}

function addNote(){
  const m=getMeeting();if(!m)return;
  const today=new Date().toISOString().slice(0,10);
  m.notes=m.notes||[];
  m.notes.unshift({id:gid(),date:today,text:'',created:new Date().toISOString()});
  render();
  setTimeout(()=>{const ta=document.querySelector('.note-textarea');if(ta)ta.focus();},60);
}

function updateNoteDate(nid,val){
  const m=getMeeting();if(!m)return;
  const n=(m.notes||[]).find(x=>x.id===nid);
  if(n){n.date=val;save();}
  const card=document.getElementById('note_'+nid);
  if(card)card.outerHTML=renderNote(n);
}

function updateNoteText(nid,val){
  const m=getMeeting();if(!m)return;
  const n=(m.notes||[]).find(x=>x.id===nid);
  if(n){n.text=val;save();}
}

function deleteNote(nid){
  if(!confirm('Delete this note?'))return;
  const m=getMeeting();if(!m)return;
  m.notes=(m.notes||[]).filter(n=>n.id!==nid);
  render();
}

function deleteDoc(did){
  const m=getMeeting();if(!m)return;
  m.docs=(m.docs||[]).filter(d=>d.id!==did);
  render();
}

function handleUpload(e){
  const m=getMeeting();if(!m)return;
  const files=Array.from(e.target.files);
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      m.docs=m.docs||[];
      m.docs.push({id:gid(),type:'file',label:file.name,size:file.size,data:ev.target.result,added:new Date().toISOString()});
      loaded++;
      if(loaded===files.length)render();
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function showModal(type){
  closeModal();selColor=COLORS[0];
  let html='';
  if(type==='newMeeting'){
    html=`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><span class="modal-title">New meeting</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <label class="fl">Meeting name *</label>
      <input class="fi" id="m_name" placeholder="e.g. Board Meeting, Weekly Standup, Client Call — Acme">
      <label class="fl">Cadence</label>
      <select class="fi" id="m_cadence">
        <option value="">None</option>
        <option>Daily</option><option>Weekly</option><option>Bi-weekly</option><option>Monthly</option><option>Quarterly</option><option>Ad-hoc</option>
      </select>
      <label class="fl">Attendees (comma separated)</label>
      <input class="fi" id="m_att" placeholder="e.g. Jen, Marcus, Sarah">
      <label class="fl">Color</label>
      <div style="display:flex;gap:9px;margin-bottom:18px">${COLORS.map((c,i)=>`<div class="swatch" id="sw_${i}" style="background:${c};border-color:${i===0?'#333':'transparent'}" onclick="pickColor('${c}',${i})"></div>`).join('')}</div>
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createMeeting()">Create</button></div>
    </div>`;
  } else if(type==='addLink'){
    html=`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><span class="modal-title">Add document link</span><button class="modal-close" onclick="closeModal()">×</button></div>
      <label class="fl">URL *</label>
      <input class="fi" id="m_url" placeholder="https://…">
      <label class="fl">Label</label>
      <input class="fi" id="m_label" placeholder="e.g. Agenda Template, Q3 Deck, Brand Guide…">
      <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doAddLink()">Add link</button></div>
    </div>`;
  }
  const ov=document.createElement('div');
  ov.className='modal-overlay';ov.id='modalOverlay';ov.innerHTML=html;
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  document.body.appendChild(ov);
  setTimeout(()=>{const fi=ov.querySelector('input:not([type="file"])');if(fi)fi.focus();},60);
}

function closeModal(){const el=document.getElementById('modalOverlay');if(el)el.remove();}
function pickColor(c,idx){selColor=c;COLORS.forEach((_,i)=>{const d=document.getElementById('sw_'+i);if(d)d.style.borderColor=i===idx?'#333':'transparent';});}

function createMeeting(){
  const name=document.getElementById('m_name')?.value?.trim();if(!name)return;
  const cadence=document.getElementById('m_cadence')?.value||'';
  const att=(document.getElementById('m_att')?.value||'').split(',').map(a=>a.trim()).filter(Boolean);
  const m={id:gid(),name,cadence,attendees:att,color:selColor,docs:[],notes:[],created:new Date().toISOString()};
  state.meetings.push(m);state.active=m.id;
  closeModal();render();
}

function doAddLink(){
  const raw=document.getElementById('m_url')?.value?.trim();if(!raw)return;
  const url=safeUrl(raw);if(!url){alert('Please enter a valid http or https URL.');return;}
  const label=document.getElementById('m_label')?.value?.trim()||raw;
  const m=getMeeting();if(!m)return;
  m.docs=m.docs||[];
  m.docs.push({id:gid(),type:'link',url,label,added:new Date().toISOString()});
  closeModal();render();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
load();render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js');
  });
}
</script>
</body>
</html>
